name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Enforce coverage floor
        run: >-
          python3 -c "import glob, sys, xml.etree.ElementTree as ET;
          files=glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True);
          assert files, 'No coverage reports were generated';
          rates=[(float(ET.parse(f).getroot().attrib['line-rate']), float(ET.parse(f).getroot().attrib['branch-rate'])) for f in files];
          print('coverage:', rates);
          sys.exit(0 if all(line >= 0.85 and branch >= 0.70 for line, branch in rates) else 1)"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
