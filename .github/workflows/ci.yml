name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # Packing runs package validation against the previous release's public API.
      - name: Pack and validate public API
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Daktela.Connector/Daktela.Connector.csproj --no-build --configuration Release --output ./nupkg

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: >-
          python3 -c "import glob, sys, xml.etree.ElementTree as ET;
          files=glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True);
          assert files, 'No coverage reports were generated';
          rates=[(float(ET.parse(f).getroot().attrib['line-rate']), float(ET.parse(f).getroot().attrib['branch-rate'])) for f in files];
          print('coverage:', rates);
          sys.exit(0 if all(line >= 0.85 and branch >= 0.70 for line, branch in rates) else 1)"

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
